[workspace]
resolver = "2"
members = [
    "src/quantumtunnel-daemon",
    "src/quantumtunnel-cli",
    "src/quantumtunnel-api",
    "crates/crypto-utils",
    "crates/tunnel-core",
    "crates/routing-engine",
    "crates/dns-proxy",
]

[workspace.package]
version = "1.4.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/MrKhan025/QuantumTunnel.git"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
pqcrypto-mlkem = "0.1.0"
pqcrypto-traits = "0.3.5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
axum = { version = "0.7", features = ["macros"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
