global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend quantumtunnel_tls_fallback_in
    bind *:443
    default_backend quantumtunnel_gateways

backend quantumtunnel_gateways
    balance leastconn
    option httpchk GET /healthz
    server gw-primary 10.66.66.1:8443 check port 8443 inter 5s fall 3 rise 2
    server gw-secondary 10.66.66.2:8443 check port 8443 inter 5s fall 3 rise 2 backup
