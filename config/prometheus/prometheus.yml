global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: "quantumtunnel-vpn-gateway"

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "wireguard-exporter"
    static_configs:
      - targets: ["wireguard:9586"]
    metric_relabel_configs:
      - regex: "endpoint"
        action: labeldrop

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
